name: Build PDF on Release

# 每当发布（publish）一个 release 时自动触发
on:
  release:
    types: [published]

# 上传附件需要 contents 写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX + Chinese support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk \
            poppler-utils

      - name: Set up Python for PDF validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation dependency
        run: python -m pip install 'pypdf>=5,<7'

      # 干净构建时，第二遍插入目录仍会改变正文页码，必须继续编译至收敛。
      - name: Compile until TOC and references stabilize
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Verify TOC page numbers against PDF destinations
        run: python scripts/check_pdf_toc.py main.pdf

      - name: Rename PDF with tag
        run: cp main.pdf "algo-template-${{ github.ref_name }}.pdf"

      - name: Upload PDF to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "algo-template-${{ github.ref_name }}.pdf" --clobber
